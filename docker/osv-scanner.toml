# Vulnerabilities in the scanner image's own Python dependencies that are accepted for now.
# Every entry needs a reason and an expiry; when it expires, osv-scanner reports it again.

# semgrep 1.178.0 (latest as of 2026-09-30) requires pyjwt~=2.13.0, so pyjwt cannot be raised
# to the fixed 2.14.0 without running semgrep on a dependency set it does not support.
# All ten advisories concern verifying untrusted JWTs or fetching JWKS; the scanner runs
# offline and never verifies tokens. Revisit when semgrep raises its pyjwt range
# (the weekly pin-freshness check reports new semgrep releases).
[[IgnoredVulns]]
id = "GHSA-2gx3-rcp4-g85q"
ignoreUntil = 2026-12-31
reason = "pyjwt pinned by semgrep 1.178.0; JWKS fetching is not used by the offline scanner"

