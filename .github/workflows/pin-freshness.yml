name: Pin freshness

# Fails when a pinned scanner has a newer release. GitHub notifies the owner of failed
# scheduled runs, which is the signal to run scripts/update-tools.sh.
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check pinned versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/update-tools.sh --check
