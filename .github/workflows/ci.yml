name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned by commit SHA: tags can be rewritten.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: shellcheck
        run: shellcheck docker/scan.sh scripts/*.sh
      # Builds the image (verifying every pinned checksum) and scans this repository with it.
      - name: Scan this repository with the kit
        run: scripts/run-scan.sh . reports
      - name: Fail if a scanner errored or found something
        run: |
          cat reports/summary.txt
          if grep -qE ' error' reports/summary.txt; then echo "::error::a scanner failed to run"; exit 1; fi
          if ! grep -qE '^gitleaks +0 hit' reports/summary.txt; then echo "::error::gitleaks found hits"; exit 1; fi
          if ! grep -qE '^semgrep +0 finding' reports/summary.txt; then echo "::error::semgrep found issues"; exit 1; fi
          if ! grep -qE '^zizmor +0 finding' reports/summary.txt; then echo "::error::zizmor found issues"; exit 1; fi
